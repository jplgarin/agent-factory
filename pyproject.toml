[project]
name = "agent-factory"
version = "0.1.0"
description = "Private multi-agent system: orchestration, memory and delegation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "structlog>=26.1.0",
    "temporalio>=1.36.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
af-gateway = "apps.gateway.__main__:main"
af-worker = "apps.worker.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.4",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "apps"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]

[tool.pyright]
include = ["core", "apps", "tests"]
strict = ["core"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers -m 'not integration'"
markers = ["integration: needs the running Docker Compose stack (make up)"]

[tool.coverage.run]
source = ["core", "apps"]
branch = true
# Process wiring; exercised by the stack tests (make test-integration), not unit tests.
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
