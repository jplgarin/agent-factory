name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
      - run: uv sync --frozen
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make migrate

  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The image is pinned in infra/ci/Dockerfile.gitleaks so Dependabot can update it.
      - run: docker build -q -t af-gitleaks -f infra/ci/Dockerfile.gitleaks infra/ci
      - run: docker run --rm -v "$PWD:/repo" af-gitleaks git /repo --redact --verbose --exit-code 1

  stack:
    name: Docker build and stack health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
      - run: make env
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: uv sync --frozen
      - run: make test-integration
      - run: make stats
      - if: failure()
        run: docker compose ps -a && docker compose logs --no-color
      - if: always()
        run: docker compose down -v
